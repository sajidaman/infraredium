services:
  - type: web
    name: infraredium-api
    runtime: python
    branch: main
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: CORS_ORIGINS
        sync: false
